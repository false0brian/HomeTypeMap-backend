name: backend-ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Python compile check
        run: |
          python -m py_compile $(find app tests scripts alembic -name '*.py')

      - name: Unit tests (schema/service)
        run: pytest -q tests/test_schemas.py tests/test_services.py
